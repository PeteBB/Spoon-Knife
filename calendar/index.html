<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Calendar</title>
<meta name="description" content="A scheduling calendar you can talk to.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗓️</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">🗓️</span>
    <span>Voice Calendar</span>
  </div>

  <div class="monthnav">
    <button type="button" id="prevMonth" class="icon-btn" aria-label="Previous month">‹</button>
    <h1 id="monthLabel" aria-live="polite">—</h1>
    <button type="button" id="nextMonth" class="icon-btn" aria-label="Next month">›</button>
    <button type="button" id="todayBtn" class="ghost-btn">Today</button>
  </div>

  <div class="topbar-actions">
    <label class="switch" title="Read confirmations back out loud">
      <input type="checkbox" id="speakBack" checked>
      <span>Speak back</span>
    </label>
    <button type="button" id="newEvent" class="ghost-btn">+ New</button>
    <button type="button" id="exportIcs" class="ghost-btn">Export .ics</button>
  </div>
</header>

<main>
  <section class="calendar" aria-label="Month view">
    <div class="weekdays" id="weekdays"></div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="side">
    <section class="voice" aria-label="Voice input">
      <button type="button" id="micBtn" class="mic" aria-pressed="false">
        <span class="mic-ring" aria-hidden="true"></span>
        <span class="mic-glyph" aria-hidden="true">🎤</span>
        <span class="sr-only">Start dictation</span>
      </button>

      <p class="mic-status" id="micStatus" aria-live="polite">Press the mic and say what you want scheduled.</p>
      <p class="transcript" id="transcript" aria-live="polite"></p>

      <form id="textForm" class="text-form" autocomplete="off">
        <input type="text" id="textInput" placeholder="…or type it: “lunch with Sarah tomorrow at noon”" aria-label="Describe the event">
        <button type="submit" class="primary-btn">Add</button>
      </form>

      <div class="examples" id="examples"></div>

      <label class="switch handsfree" title="Keep the mic open so you can dictate several events in a row">
        <input type="checkbox" id="handsFree">
        <span>Hands-free (keep listening)</span>
      </label>
    </section>

    <section class="agenda" aria-label="Selected day">
      <header class="agenda-head">
        <h2 id="agendaTitle">—</h2>
        <button type="button" id="addOnDay" class="ghost-btn small">+ Add</button>
      </header>
      <ul class="agenda-list" id="agendaList"></ul>
    </section>
  </aside>
</main>

<!-- create / edit -->
<dialog id="editor" class="dialog">
  <form method="dialog" id="editorForm">
    <h2 id="editorTitle">New event</h2>

    <label class="field">
      <span>Title</span>
      <input type="text" id="fTitle" required maxlength="120">
    </label>

    <div class="field-row">
      <label class="field">
        <span>Date</span>
        <input type="date" id="fDate" required>
      </label>
      <label class="field checkbox">
        <input type="checkbox" id="fAllDay">
        <span>All day</span>
      </label>
    </div>

    <div class="field-row" id="timeRow">
      <label class="field">
        <span>Starts</span>
        <input type="time" id="fStart">
      </label>
      <label class="field">
        <span>Minutes</span>
        <input type="number" id="fDuration" min="5" max="1440" step="5" value="60">
      </label>
    </div>

    <div class="field-row">
      <label class="field">
        <span>Repeats</span>
        <select id="fRepeat">
          <option value="">Does not repeat</option>
          <option value="daily">Every day</option>
          <option value="weekdays">Every weekday</option>
          <option value="weekly">Every week</option>
          <option value="biweekly">Every 2 weeks</option>
          <option value="monthly">Every month</option>
          <option value="yearly">Every year</option>
        </select>
      </label>
      <label class="field" id="untilField">
        <span>Until (optional)</span>
        <input type="date" id="fUntil">
      </label>
    </div>

    <label class="field">
      <span>Notes</span>
      <textarea id="fNotes" rows="2" maxlength="500"></textarea>
    </label>

    <menu class="dialog-actions">
      <button type="button" id="deleteFromEditor" class="danger-btn">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="cancelEditor" class="ghost-btn">Cancel</button>
      <button type="submit" class="primary-btn">Save</button>
    </menu>
  </form>
</dialog>

<!-- delete one occurrence vs. the whole series -->
<dialog id="scopeDialog" class="dialog small">
  <h2>Delete repeating event</h2>
  <p id="scopeText">This event repeats.</p>
  <menu class="dialog-actions">
    <button type="button" id="scopeCancel" class="ghost-btn">Cancel</button>
    <button type="button" id="scopeOne" class="ghost-btn">This day only</button>
    <button type="button" id="scopeAll" class="danger-btn">Whole series</button>
  </menu>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span>
  <button type="button" id="toastAction" class="link-btn"></button>
</div>

<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
